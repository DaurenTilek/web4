<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap Validation</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<nav>
    <a href="index.html">Home</a>
    <a href="validation.html">Task 1</a>
    <a href="bootstrap.html">Task 2</a>
    <a href="feedback.html">Task 3</a>
    <a href="registration.html">Task 4</a>
</nav>

<div class="container">
    <h1>Bootstrap Validation</h1>

    <form id="feedbackForm" novalidate>
        <label for="name" class="form-label">Name</label>
        <input type="text" class="form-control" id="name" required>
        <div class="valid-feedback">Looks good!</div>
        <div class="invalid-feedback">Name is required.</div>

        <label for="email" class="form-label mt-3">Email</label>
        <input type="email" class="form-control" id="email" required>
        <div class="valid-feedback">Looks good!</div>
        <div class="invalid-feedback">Enter a valid email.</div>

        <label for="message" class="form-label mt-3">Message</label>
        <textarea class="form-control" id="message" required></textarea>
        <div class="valid-feedback">Looks good!</div>
        <div class="invalid-feedback">Message is required.</div>

        <button class="btn btn-primary mt-3" type="submit">Submit</button>
        <p id="feedbackResult" class="mt-3"></p>
    </form>
</div>

<script src="script.js"></script>
</body>
</html>
