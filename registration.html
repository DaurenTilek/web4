<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<nav>
    <a href="index.html">Home</a>
    <a href="validation.html">Task 1</a>
    <a href="bootstrap.html">Task 2</a>
    <a href="feedback.html">Task 3</a>
    <a href="registration.html">Task 4</a>
</nav>

<div class="container">
    <h1>Registration Form</h1>

    <form id="registrationForm" class="row g-3" novalidate>

        <div class="col-md-6">
            <label for="firstName" class="form-label">First Name</label>
            <input type="text" class="form-control" id="firstName" required>
            <div class="valid-feedback">Looks good!</div>
            <div class="invalid-feedback">First name is required.</div>
        </div>

        <div class="col-md-6">
            <label for="lastName" class="form-label">Last Name</label>
            <input type="text" class="form-control" id="lastName" required>
            <div class="valid-feedback">Looks good!</div>
            <div class="invalid-feedback">Last name is required.</div>
        </div>

        <div class="col-12">
            <label for="email" class="form-label">Email</label>
            <input type="email" class="form-control" id="email" required>
            <div class="valid-feedback">Looks good!</div>
            <div class="invalid-feedback">Enter a valid email.</div>
        </div>

        <div class="col-md-6">
            <label for="password" class="form-label">Password</label>
            <input type="password" class="form-control" id="password" minlength="6" required>
            <div class="valid-feedback">Looks good!</div>
            <div class="invalid-feedback">Minimum 6 characters.</div>
        </div>

        <div class="col-md-6">
            <label for="confirmPassword" class="form-label">Confirm Password</label>
            <input type="password" class="form-control" id="confirmPassword" required>
            <div class="valid-feedback">Passwords match!</div>
            <div class="invalid-feedback">Passwords must match.</div>
        </div>

        <div class="col-12">
            <label class="form-label">Gender</label>
            <div class="form-check">
                <input type="radio" class="form-check-input" name="gender" id="male" value="male" required>
                <label for="male" class="form-check-label">Male</label>
            </div>
            <div class="form-check">
                <input type="radio" class="form-check-input" name="gender" id="female" value="female">
                <label for="female" class="form-check-label">Female</label>
            </div>
        </div>

        <div class="col-12">
            <label class="form-label">Hobbies</label>
            <div class="form-check">
                <input type="checkbox" class="form-check-input" id="sports">
                <label for="sports" class="form-check-label">Sports</label>
            </div>
            <div class="form-check">
                <input type="checkbox" class="form-check-input" id="music">
                <label for="music" class="form-check-label">Music</label>
            </div>
            <div class="form-check">
                <input type="checkbox" class="form-check-input" id="reading">
                <label for="reading" class="form-check-label">Reading</label>
            </div>
        </div>

        <div class="col-12">
            <label for="country" class="form-label">Country</label>
            <select id="country" class="form-select" required>
                <option value="">Choose country</option>
                <option value="Kazakhstan">Kazakhstan</option>
                <option value="USA">USA</option>
                <option value="UK">UK</option>
                <option value="Turkey">Turkey</option>
            </select>
            <div class="valid-feedback">Looks good!</div>
            <div class="invalid-feedback">Choose a country.</div>
        </div>

        <div class="col-12">
            <button type="submit" class="btn btn-primary">Register</button>
            <button type="reset" class="btn btn-secondary">Reset</button>
        </div>

        <p id="registrationResult"></p>
    </form>
</div>

<script src="script.js"></script>
</body>
</html>
